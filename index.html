<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Deliberately one fixed dark value. The Android status bar colour is compiled
     into the APK and cannot follow an in-app theme, so the browser and the
     installed PWA are held to the same dark chrome. A light theme then meets a
     dark system bar consistently everywhere instead of only looking wrong in
     the app. -->
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Six week plan: sessions, meals, set logging and the Sunday report.">
<title>Fitness</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
<script>
// Runs before first paint so a chosen theme never flashes the other one.
// Reads the same localStorage document the app uses; if anything is off it
// falls through to the defaults in the stylesheet.
(function () {
  try {
    var raw = localStorage.getItem('fitness.data.v1');
    var s = raw ? (JSON.parse(raw).settings || {}) : {};
    var root = document.documentElement;
    root.setAttribute('data-theme', s.theme || 'system');
    root.setAttribute('data-accent', s.accent || 'blue');
    root.setAttribute('data-textsize', s.textSize || 'normal');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'system');
  }
})();
</script>
</head>
<body>

<header class="topbar">
  <span class="brand">Fitness</span>
  <span id="timerslot"></span>
  <span class="pill" id="syncpill" data-state="offline"><span class="dot"></span><span id="synctext">Local</span></span>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <a href="#today" data-tab="today">
    <svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="M8 2.8v3M16 2.8v3M4 9.5h16"/><path d="m9 14 2 2 4-4"/></svg>
    Today
  </a>
  <a href="#meals" data-tab="meals">
    <svg viewBox="0 0 24 24"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M2.5 20h19"/><path d="M7 7.5c0-1.2 1.2-1.5 1.2-2.7S7 2.8 7 2.8M12 7.5c0-1.2 1.2-1.5 1.2-2.7S12 2.8 12 2.8M17 7.5c0-1.2 1.2-1.5 1.2-2.7S17 2.8 17 2.8"/></svg>
    Meals
  </a>
  <a href="#train" data-tab="train">
    <svg viewBox="0 0 24 24"><path d="M2.5 9.5v5M5.5 7v10M18.5 7v10M21.5 9.5v5M5.5 12h13"/></svg>
    Train
  </a>
  <a href="#log" data-tab="log">
    <svg viewBox="0 0 24 24"><path d="M3.5 3.5v17h17"/><path d="m7 15 4-5 3 2.5 5-6.5"/></svg>
    Log
  </a>
  <a href="#coach" data-tab="coach">
    <svg viewBox="0 0 24 24"><path d="M20.5 14.5a2.5 2.5 0 0 1-2.5 2.5H9l-4.5 3.5V6a2.5 2.5 0 0 1 2.5-2.5h11A2.5 2.5 0 0 1 20.5 6z"/><path d="M12 6.8l1.1 2.6 2.6 1.1-2.6 1.1L12 14.2l-1.1-2.6L8.3 10.5l2.6-1.1z"/></svg>
    Coach
  </a>
  <a href="#settings" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    Settings
  </a>
</nav>

<script type="module" src="./app.js"></script>
</body>
</html>
